<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="owlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#da1a07"/>
      <stop offset="100%" style="stop-color:#e63946"/>
    </linearGradient>
    <linearGradient id="owlGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#da1a07"/>
    </linearGradient>
  </defs>
  <g transform="translate(0, 0)">
    <!-- Owl ears -->
    <path d="M12 5 L22 20 L8 20 Z" fill="url(#owlGrad)" opacity="0.9"/>
    <path d="M42 5 L52 20 L38 20 Z" fill="url(#owlGrad)" opacity="0.9"/>
    <!-- Owl head/body -->
    <ellipse cx="32" cy="38" rx="26" ry="24" fill="url(#owlGrad)"/>
    <!-- Owl face mask -->
    <ellipse cx="32" cy="35" rx="20" ry="16" fill="#1c1c1b" opacity="0.3"/>
    <!-- Left eye outer -->
    <circle cx="22" cy="32" r="10" fill="#1c1c1b"/>
    <circle cx="22" cy="32" r="8" fill="url(#owlGrad2)" opacity="0.8"/>
    <circle cx="22" cy="32" r="5" fill="#1c1c1b"/>
    <circle cx="20" cy="30" r="2" fill="rgba(255,255,255,0.6)"/>
    <!-- Right eye outer -->
    <circle cx="42" cy="32" r="10" fill="#1c1c1b"/>
    <circle cx="42" cy="32" r="8" fill="url(#owlGrad2)" opacity="0.8"/>
    <circle cx="42" cy="32" r="5" fill="#1c1c1b"/>
    <circle cx="40" cy="30" r="2" fill="rgba(255,255,255,0.6)"/>
    <!-- Beak -->
    <path d="M29 40 L32 46 L35 40 Z" fill="#ffcc00" opacity="0.9"/>
    <!-- Wings -->
    <path d="M6 38 Q2 50 10 58 Q16 52 14 42 Z" fill="url(#owlGrad)" opacity="0.7"/>
    <path d="M58 38 Q62 50 54 58 Q48 52 50 42 Z" fill="url(#owlGrad)" opacity="0.7"/>
  </g>
</svg>
